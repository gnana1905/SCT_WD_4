<!DOCTYPE html><html><head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>To-Do App</title><link rel='stylesheet' href='style.css'></head>
<body>
<div class='container'>
<h1>To-Do List</h1>
<div class='top'>
<input id='task' placeholder='Enter task'>
<input id='datetime' type='datetime-local'>
<button id='add'>Add</button>
<button id='theme'>🌙</button>
</div>
<input id='search' placeholder='Search tasks'>
<div class='filters'>
<button data-f='all'>All</button>
<button data-f='pending'>Pending</button>
<button data-f='completed'>Completed</button>
</div>
<ul id='list'></ul>
</div>
<script src='script.js'></script>
</body></html>
